# Cấu hình deploy Render (Blueprint) — tiêu chí 12. Dùng thay hoặc song song với railway.toml.
#
# Khác Railway: Render khai báo được cả Redis (service `keyvalue`) ngay trong file này, và nối
# REDIS_URL tự động qua `fromService`, nên không phải làm thủ công trên dashboard.
#
# Secret KHÔNG ghi thẳng giá trị vào file (file này nằm trong git):
#   • generateValue: true → Render tự sinh chuỗi ngẫu nhiên, xem lại trong dashboard
#   • sync: false         → để trống trong file, bạn nhập giá trị trên dashboard khi tạo Blueprint
#
# File này nằm trong thư mục con, không phải gốc repo, nên:
#   • Khi tạo Blueprint trên dashboard, điền ô "Blueprint Path" = 06-lab-complete/render.yaml
#   • `rootDir` bên dưới trỏ tới thư mục chứa Dockerfile; `dockerfilePath` tính theo rootDir
#     (theo tài liệu Render: "relative to the service's rootDir"). Thiếu rootDir thì Render
#     tìm Dockerfile ở gốc repo và build lỗi.
services:
  - type: web
    name: ai-agent
    runtime: docker
    rootDir: 06-lab-complete
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: agent-redis
          property: connectionString
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "10"

  - type: keyvalue
    name: agent-redis
    plan: free
    maxmemoryPolicy: noeviction
    # Danh sách rỗng = chỉ các service trong cùng tài khoản Render truy cập được, không mở ra Internet
    ipAllowList: []
